<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bike Service Checklist</title>
  <!-- ✅ Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

  <!-- Header -->
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-6 mb-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Bike Service Checklist</h1>
    <div class="text-sm text-gray-600">
      <p><strong>Customer:</strong> Jane Doe</p>
      <p><strong>Bike:</strong> Trek Marlin 5 (SN: ABC123456)</p>
      <p><strong>Mechanic:</strong> Kirk</p>
      <p><strong>Date:</strong> July 26, 2025</p>
    </div>
  </div>

  <!-- Checklist Form -->
  <form class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-6 space-y-4">
    
    <h2 class="text-xl font-semibold text-gray-700 mb-4">Checklist</h2>

    <div class="flex items-start gap-3">
      <input type="checkbox" id="brakes" name="brakes" class="mt-1 w-5 h-5 text-green-600 focus:ring-green-500 border-gray-300 rounded" />
      <label for="brakes" class="text-gray-800">Check and adjust brakes</label>
    </div>

    <div class="flex items-start gap-3">
      <input type="checkbox" id="chain" name="chain" class="mt-1 w-5 h-5 text-green-600 focus:ring-green-500 border-gray-300 rounded" />
      <label for="chain" class="text-gray-800">Clean and lubricate chain</label>
    </div>

    <div class="flex items-start gap-3">
      <input type="checkbox" id="tires" name="tires" class="mt-1 w-5 h-5 text-green-600 focus:ring-green-500 border-gray-300 rounded" />
      <label for="tires" class="text-gray-800">Inspect tire wear and pressure</label>
    </div>

    <div class="flex items-start gap-3">
      <input type="checkbox" id="shifting" name="shifting" class="mt-1 w-5 h-5 text-green-600 focus:ring-green-500 border-gray-300 rounded" />
      <label for="shifting" class="text-gray-800">Adjust shifting and derailleurs</label>
    </div>

    <div class="flex items-start gap-3">
      <input type="checkbox" id="bolts" name="bolts" class="mt-1 w-5 h-5 text-green-600 focus:ring-green-500 border-gray-300 rounded" />
      <label for="bolts" class="text-gray-800">Tighten all bolts and check headset</label>
    </div>

    <!-- Notes -->
    <div>
      <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Additional Notes</label>
      <textarea id="notes" name="notes" rows="4" class="w-full border rounded-lg p-2 border-gray-300 focus:ring-green-500 focus:border-green-500"></textarea>
    </div>

    <!-- Submit -->
    <div class="pt-4">
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-xl shadow">
        Save Checklist
      </button>
    </div>

  </form>

</body>
</html>
